  code_assets: ^1.2.1
  crypto: ^3.0.6
  ffi: ^2.2.0
  hooks: ^2.0.2
  path: ^1.9.1

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
  ffigen: ^17.0.0
